<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusSound — Ambient Noise Mixer</title>
  <meta name="description"
    content="A minimalist ambient noise mixer. Blend rain, ocean, coffee shop, forest, and more to craft your perfect focus environment." />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            slate: {
              850: '#0f172a',
              950: '#020617',
            }
          },
          animation: {
            'pulse-soft': 'pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 8s linear infinite',
            'fade-in': 'fade-in 0.5s ease forwards',
          },
          keyframes: {
            'pulse-soft': {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' },
            },
            'fade-in': {
              from: { opacity: '0', transform: 'translateY(12px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* ─── Base & Layout ─── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #020617;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Animated gradient orbs in background ─── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
    }

    .bg-orb-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -200px;
      left: -200px;
      animation: float-1 18s ease-in-out infinite alternate;
    }

    .bg-orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #10b981 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      animation: float-2 22s ease-in-out infinite alternate;
    }

    .bg-orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #0ea5e9 0%, transparent 70%);
      top: 50%;
      left: 60%;
      animation: float-3 15s ease-in-out infinite alternate;
    }

    @keyframes float-1 {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(80px, 60px);
      }
    }

    @keyframes float-2 {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-60px, -80px);
      }
    }

    @keyframes float-3 {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(40px, -50px);
      }
    }

    /* ─── Sound Card ─── */
    .sound-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
      animation: fade-in 0.6s ease forwards;
      opacity: 0;
    }

    .sound-card:nth-child(1) {
      animation-delay: 0.05s;
    }

    .sound-card:nth-child(2) {
      animation-delay: 0.10s;
    }

    .sound-card:nth-child(3) {
      animation-delay: 0.15s;
    }

    .sound-card:nth-child(4) {
      animation-delay: 0.20s;
    }

    .sound-card:nth-child(5) {
      animation-delay: 0.25s;
    }

    .sound-card:nth-child(6) {
      animation-delay: 0.30s;
    }

    .sound-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .sound-card.active {
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 0 1px var(--card-glow), 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    /* Glow shimmer on active card top edge */
    .sound-card.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
      border-radius: 2px 2px 0 0;
      opacity: 0.9;
    }

    /* ─── Icon bubble ─── */
    .icon-bubble {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sound-card.active .icon-bubble {
      background: var(--card-bg-soft);
      border-color: var(--card-glow);
      box-shadow: 0 0 20px var(--card-shadow);
    }

    .sound-card.active .icon-bubble svg {
      filter: drop-shadow(0 0 6px var(--card-glow));
    }

    /* ─── Toggle Button ─── */
    .toggle-btn {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease;
      flex-shrink: 0;
    }

    .toggle-btn::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }

    .sound-card.active .toggle-btn {
      background: var(--card-glow);
      border-color: transparent;
    }

    .sound-card.active .toggle-btn::after {
      transform: translateX(20px);
      background: #fff;
    }

    /* ─── Range Slider ─── */
    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      cursor: pointer;
    }

    /* Fixed tracking gradient dynamically applied via state always */
    .volume-slider {
      background: linear-gradient(to right,
          var(--track-color, rgba(255, 255, 255, 0.1)) 0%,
          var(--track-color, rgba(255, 255, 255, 0.1)) var(--slider-pct, 50%),
          rgba(255, 255, 255, 0.1) var(--slider-pct, 50%),
          rgba(255, 255, 255, 0.1) 100%);
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .sound-card.active .volume-slider::-webkit-slider-thumb {
      background: var(--card-glow);
      border-color: #fff;
      box-shadow: 0 0 10px var(--card-shadow);
      transform: scale(1.1);
    }

    .sound-card.active .volume-slider::-moz-range-thumb {
      background: var(--card-glow);
      border-color: #fff;
    }

    .volume-slider:hover::-webkit-slider-thumb {
      transform: scale(1.2);
    }

    /* ─── Playing wave animation ─── */
    .wave-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .wave-bars span {
      display: inline-block;
      width: 3px;
      border-radius: 2px;
      background: var(--card-glow);
      animation: wave-bar 1s ease-in-out infinite;
    }

    .wave-bars span:nth-child(1) {
      animation-delay: 0s;
      height: 40%;
    }

    .wave-bars span:nth-child(2) {
      animation-delay: 0.15s;
      height: 70%;
    }

    .wave-bars span:nth-child(3) {
      animation-delay: 0.3s;
      height: 100%;
    }

    .wave-bars span:nth-child(4) {
      animation-delay: 0.15s;
      height: 70%;
    }

    .wave-bars span:nth-child(5) {
      animation-delay: 0s;
      height: 40%;
    }

    @keyframes wave-bar {

      0%,
      100% {
        transform: scaleY(0.3);
      }

      50% {
        transform: scaleY(1);
      }
    }

    .wave-bars.hidden {
      display: none;
    }

    /* ─── Master controls ─── */
    .master-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #94a3b8;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .master-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .master-btn.danger:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* ─── Status badge ─── */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.3s ease;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    /* ─── Volume zero warning shake ─── */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-4px);
      }

      40% {
        transform: translateX(4px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    .shake {
      animation: shake 0.4s ease !important;
    }

    @media (max-width: 480px) {
      .sound-card {
        border-radius: 16px;
      }

      .icon-bubble {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body class="relative text-slate-100 selection:bg-indigo-500/30">

  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="relative z-10 flex flex-col min-h-screen px-4 sm:px-6 lg:px-8 pb-16">

    <header class="pt-10 pb-8 text-center">
      <div
        class="inline-flex items-center gap-2 mb-3 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-slate-400 uppercase tracking-widest font-medium">
        <span class="status-dot" id="global-dot"></span>
        <span id="global-status-text">All silent</span>
      </div>
      <h1
        class="text-4xl sm:text-5xl font-bold tracking-tight bg-gradient-to-br from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
        FocusSound
      </h1>
      <p class="mt-3 text-slate-400 text-base sm:text-lg max-w-sm mx-auto leading-relaxed font-light">
        Blend ambient sounds to craft your perfect focus environment.
      </p>

      <div class="flex items-center justify-center gap-3 mt-6">
        <button class="master-btn" id="btn-pause-all" onclick="pauseAll()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
          Pause All
        </button>
        <button class="master-btn danger" id="btn-reset-all" onclick="resetAll()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 .49-3.45" />
          </svg>
          Reset
        </button>
      </div>
    </header>

    <main class="flex-1">
      <div class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5" id="sound-grid">
      </div>
    </main>

    <footer class="mt-12 text-center text-slate-600 text-xs">
      All audio sourced from royalty-free public domain archives.
    </footer>
  </div>

  <script>
    const SOUNDS = [
      {
        id: 'rain',
        label: 'Rain',
        description: 'Steady rainfall on leaves',
        accentColor: '#60a5fa',
        shadowColor: 'rgba(96,165,250,0.35)',
        bgSoft: 'rgba(96,165,250,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/d/db/Rain_on_a_tin_roof.ogg/Rain_on_a_tin_roof.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="19" x2="8" y2="21"/><line x1="8" y1="23" x2="8" y2="23"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="12" y1="19" x2="12" y2="19"/><line x1="16" y1="19" x2="16" y2="21"/><line x1="16" y1="23" x2="16" y2="23"/></svg>`,
      },
      {
        id: 'ocean',
        label: 'Ocean Waves',
        description: 'Gentle rolling surf',
        accentColor: '#34d399',
        shadowColor: 'rgba(52,211,153,0.35)',
        bgSoft: 'rgba(52,211,153,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/1/1d/Waves_of_the_Pacific_Ocean_at_La_Serena.ogg/Waves_of_the_Pacific_Ocean_at_La_Serena.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-5 10-5 10 5 10 5"/><path d="M2 12s3 5 10 5 10-5 10-5"/><path d="M2 17c3-2 7-2 10 0s7 2 10 0"/></svg>`,
      },
      {
        id: 'coffee',
        label: 'Coffee Shop',
        description: 'Warm café ambience',
        accentColor: '#fb923c',
        shadowColor: 'rgba(251,146,60,0.35)',
        bgSoft: 'rgba(251,146,60,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/2/22/Paris_Caf%C3%A9_Ambience.ogg/Paris_Caf%C3%A9_Ambience.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`,
      },
      {
        id: 'forest',
        label: 'Forest Birds',
        description: 'Birdsong in the canopy',
        accentColor: '#a3e635',
        shadowColor: 'rgba(163,230,53,0.35)',
        bgSoft: 'rgba(163,230,53,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/e/e3/Forest_ambience_with_birds.ogg/Forest_ambience_with_birds.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21V8a5 5 0 0 0-10 0v13"/><line x1="12" y1="3" x2="12" y2="8"/><path d="M5 21h14"/><path d="M9 12c0-1.7 1.3-3 3-3s3 1.3 3 3"/><circle cx="19" cy="7" r="2"/><circle cx="5" cy="9" r="1.5"/></svg>`,
      },
      {
        id: 'brownnoise',
        label: 'Brown Noise',
        description: 'Deep rumbling static',
        accentColor: '#c084fc',
        shadowColor: 'rgba(192,132,252,0.35)',
        bgSoft: 'rgba(192,132,252,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c5/Brown_noise.ogg/Brown_noise.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      },
      {
        id: 'fireplace',
        label: 'Fireplace',
        description: 'Crackling warm hearth',
        accentColor: '#f87171',
        shadowColor: 'rgba(248,113,113,0.35)',
        bgSoft: 'rgba(248,113,113,0.12)',
        defaultVolume: 0.5,
        src: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/5/5b/Fireplace.ogg/Fireplace.ogg.mp3',
        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6c0 0-4 4-4 8 0 2.21 1.79 4 4 4s4-1.79 4-4c0-4-4-8-4-8z"/><path d="M12 14c0 0-2 1-2 2s.9 2 2 2 2-.9 2-2-2-2-2-2z"/></svg>`,
      },
    ];

    const state = {};

    function initAudio(sound) {
      const audio = new Audio();
      audio.loop = true;
      audio.preload = 'none';
      audio.volume = sound.defaultVolume;

      state[sound.id] = {
        audio,
        active: false,
        volume: sound.defaultVolume,
        srcLoaded: false,
        src: sound.src,
        accentColor: sound.accentColor
      };
    }

    function buildCard(sound) {
      const card = document.createElement('div');
      card.className = 'sound-card p-5';
      card.id = `card-${sound.id}`;
      card.style.setProperty('--card-glow', sound.accentColor);
      card.style.setProperty('--card-shadow', sound.shadowColor);
      card.style.setProperty('--card-bg-soft', sound.bgSoft);

      const defaultPct = sound.defaultVolume * 100;

      card.innerHTML = `
        <div class="flex items-start justify-between mb-4">
          <div class="icon-bubble" style="color: ${sound.accentColor}">
            ${sound.icon}
          </div>
          <div class="flex flex-col items-end gap-2">
            <div class="wave-bars hidden" id="wave-${sound.id}">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <button
              class="toggle-btn"
              id="toggle-${sound.id}"
              aria-label="Toggle ${sound.label}"
              aria-pressed="false"
              onclick="toggleSound('${sound.id}')"
            ></button>
          </div>
        </div>

        <div class="mb-1">
          <h2 class="text-sm font-semibold text-slate-100 tracking-wide">${sound.label}</h2>
          <p class="text-xs text-slate-500 mt-0.5">${sound.description}</p>
        </div>

        <div class="mt-4 relative">
          <input
            type="range"
            id="slider-${sound.id}"
            class="volume-slider"
            min="0" max="100"
            value="${defaultPct}"
            aria-label="${sound.label} volume"
            oninput="setVolume('${sound.id}', this.value)"
          />
          <div class="flex justify-between mt-2 text-xs text-slate-600" aria-hidden="true">
            <span>0</span>
            <span id="vol-label-${sound.id}" class="text-slate-500">${defaultPct}%</span>
            <span>100</span>
          </div>
        </div>
      `;

      return card;
    }

    async function toggleSound(id, skipGlobalUpdate = false) {
      const s = state[id];
      const card = document.getElementById(`card-${id}`);
      const slider = document.getElementById(`slider-${id}`);
      const toggle = document.getElementById(`toggle-${id}`);
      const wave = document.getElementById(`wave-${id}`);

      if (!s.active) {
        let vol = parseInt(slider.value, 10);
        if (vol === 0) {
          vol = 50;
          slider.value = 50;
          s.volume = 0.5;
          document.getElementById(`vol-label-${id}`).textContent = '50%';
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 450);
        }

        if (!s.srcLoaded) {
          s.audio.src = s.src;
          s.srcLoaded = true;
        }

        s.audio.volume = s.volume;
        slider.style.setProperty('--track-color', s.accentColor);
        slider.style.setProperty('--slider-pct', `${vol}%`);

        try {
          await s.audio.play();
        } catch (err) {
          console.warn(`[FocusSound] Could not play "${id}":`, err);
        }

        s.active = true;
        card.classList.add('active');
        wave.classList.remove('hidden');
        toggle.setAttribute('aria-pressed', 'true');
      } else {
        s.audio.pause();
        s.active = false;
        card.classList.remove('active');
        wave.classList.add('hidden');
        toggle.setAttribute('aria-pressed', 'false');
        slider.style.setProperty('--track-color', 'rgba(255, 255, 255, 0.1)');
      }

      if (!skipGlobalUpdate) updateGlobalStatus();
    }

    function setVolume(id, rawValue) {
      const val = parseInt(rawValue, 10);
      const vol = val / 100;
      const s = state[id];
      s.volume = vol;
      s.audio.volume = vol;

      document.getElementById(`vol-label-${id}`).textContent = `${val}%`;

      const slider = document.getElementById(`slider-${id}`);
      if (slider) {
        slider.style.setProperty('--slider-pct', `${val}%`);
        slider.style.setProperty('--track-color', s.active ? s.accentColor : 'rgba(255, 255, 255, 0.1)');
      }
    }

    function pauseAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) toggleSound(s.id, true);
      });
      updateGlobalStatus();
    }

    function resetAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) toggleSound(s.id, true);
        const slider = document.getElementById(`slider-${s.id}`);
        if (slider) {
          slider.value = s.defaultVolume * 100;
          setVolume(s.id, s.defaultVolume * 100);
        }
      });
      updateGlobalStatus();
    }

    function updateGlobalStatus() {
      const activeCount = SOUNDS.filter(s => state[s.id].active).length;
      const dot = document.getElementById('global-dot');
      const text = document.getElementById('global-status-text');

      if (activeCount === 0) {
        dot.classList.remove('active');
        text.textContent = 'All silent';
      } else {
        dot.classList.add('active');
        text.textContent = activeCount === 1 ? '1 sound playing' : `${activeCount} sounds playing`;
      }
    }

    (function init() {
      const grid = document.getElementById('sound-grid');
      SOUNDS.forEach(sound => {
        initAudio(sound);
        const card = buildCard(sound);
        grid.appendChild(card);

        // Initial setup for the slider tracks
        const defaultPct = sound.defaultVolume * 100;
        const slider = card.querySelector('.volume-slider');
        slider.style.setProperty('--slider-pct', `${defaultPct}%`);
      });
    })();
  </script>
</body>

</html>
